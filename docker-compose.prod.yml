services:
  # --- PROXY INVERSO (Nginx) ---
  proxy:
    image: nginx:alpine
    container_name: nginx_rubikTimer
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
    networks:
      - red_interna
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- GENERADOR SSL (Certbot) ---
  certbot:
    image: certbot/certbot
    container_name: certbot_rubikTimer
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew; sleep 12d & wait $${!}; done'"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"