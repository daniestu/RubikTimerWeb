landing.cta_principal=Start timing
landing.cta_nota=Free. No ads. No account needed.
landing.cta_final=Start timing for free
landing.h1=Free online Rubik's Cube timer, no account needed
landing.subheadline=Generate scrambles, time your solves, and check your Ao5, Ao12, and Ao100 averages — all from your browser, no sign-up required.
landing.feature1_titulo=Instant scrambles
landing.feature1_texto=Generate a new scramble with one click, keep a history, and go back to the previous one whenever you want.
landing.feature2_titulo=Real-time stats
landing.feature2_texto=Ao5, Ao12, Ao100, your best rolling average, and your standard deviation, all calculated live.
landing.feature3_titulo=No account needed
landing.feature3_texto=Start timing right now, straight from your browser. If you want to save your times to the cloud later, you can create a free account anytime.
landing.feature4_titulo=Your sessions, organized
landing.feature4_texto=Create as many sessions as you like — one per event, one per cube — and switch between them instantly.
landing.pasos_titulo=How it works
landing.paso1_titulo=Open the timer
landing.paso1_texto=No sign-up. A scramble is generated automatically.
landing.paso2_titulo=Solve and hit space
landing.paso2_texto=The timer starts and stops on its own, so you can focus on solving.
landing.paso3_titulo=Check your progress
landing.paso3_texto=Every solve is saved instantly along with its stats.
landing.faq_titulo=Frequently asked questions
landing.faq1_pregunta=Do I need an account to use DTimer?
landing.faq1_respuesta=No. You can time your solves without signing up — your times are saved in your own browser. If you'd rather access them from multiple devices, you can create a free account anytime.
landing.faq2_pregunta=Is DTimer free?
landing.faq2_respuesta=Yes, DTimer is completely free, with no ads.
landing.faq3_pregunta=What are Ao5, Ao12, and Ao100?
landing.faq3_respuesta=They're the averages of your last 5, 12, or 100 solves, dropping the best and worst of each group — the same standard used in official competitions.
landing.faq4_pregunta=Can I use DTimer on mobile?
landing.faq4_respuesta=Yes, it works straight from your phone's browser, no installation needed.
landing.faq5_pregunta=Can I import or export my times?
landing.faq5_respuesta=Yes, you can export your times to a file and import them again anytime from the timer's options menu.
landing.footer_texto=free online Rubik's Cube timer.

