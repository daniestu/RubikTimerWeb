seo.titulo_inicio=DTimer — Бесплатный онлайн-таймер для кубика Рубика
seo.descripcion_inicio=Засекайте время сборки кубика Рубика бесплатно и без регистрации. Официальные скрамблы WCA, статистика Ao5/Ao12/Ao100 и автоматическое сохранение результатов.
seo.titulo_login=Вход | DTimer
seo.descripcion_login=Войдите в DTimer, чтобы получить доступ к сохраненным сессиям и статистике сборки кубика Рубика.
seo.titulo_registro=Создать бесплатный аккаунт | DTimer
seo.descripcion_registro=Создайте бесплатный аккаунт DTimer, чтобы сохранять свои результаты, сессии и статистику кубика Рубика в облаке.
seo.titulo_timer=Таймер | DTimer
seo.descripcion_timer=Засекайте время сборки кубика Рубика: генерируйте скрамблы, сохраняйте результаты и отслеживайте статистику Ao5, Ao12 и Ao100 в реальном времени.
seo.titulo_blog_index=Блог | DTimer
seo.descripcion_blog_index=Гайды и советы по кубику Рубика: статистика, способы улучшения результатов и сравнение онлайн-таймеров.
seo.titulo_blog_ao5=Что такое Ao5, Ao12 и Ao100? | Блог DTimer
seo.descripcion_blog_ao5=Узнайте, как на самом деле рассчитываются Ao5, Ao12 и Ao100, с пошаговым числовым примером.
seo.titulo_blog_mejorar=Как улучшить время сборки кубика Рубика | Блог DTimer
seo.descripcion_blog_mejorar=Конкретные советы по ускорению сборки кубика Рубика: прединспекция, lookahead, алгоритмы и статистика.
seo.titulo_blog_cronometros=Лучшие онлайн-таймеры для кубика Рубика | Блог DTimer
seo.descripcion_blog_cronometros=На что обратить внимание перед выбором таймера для кубика Рубика и сравнение самых популярных вариантов.

