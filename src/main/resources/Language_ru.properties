landing.h1=Бесплатный онлайн-таймер для кубика Рубика без регистрации
landing.subheadline=Генерируйте скрамблы, засекайте время сборки и отслеживайте средние результаты Ao5, Ao12 и Ao100 — прямо в браузере и без создания аккаунта.
landing.feature1_titulo=Мгновенные скрамблы
landing.feature1_texto=Генерируйте новый скрамбл в один клик, сохраняйте историю и возвращайтесь к предыдущему в любой момент.
landing.feature2_titulo=Статистика в реальном времени
landing.feature2_texto=Ao5, Ao12, Ao100, ваш лучший средний результат и стандартное отклонение рассчитываются автоматически.
landing.feature3_titulo=Без регистрации
landing.feature3_texto=Начните засекать время прямо сейчас из браузера. Если позже вы захотите сохранить результаты в облаке, вы сможете создать бесплатный аккаунт в любое время.
landing.feature4_titulo=Удобные сессии
landing.feature4_texto=Создавайте столько сессий, сколько нужно — по дисциплинам или по кубикам — и мгновенно переключайтесь между ними.
landing.pasos_titulo=Как это работает
landing.paso1_titulo=Откройте таймер
landing.paso1_texto=Без регистрации. Скрамбл генерируется автоматически.
landing.paso2_titulo=Сберите и нажмите пробел
landing.paso2_texto=Таймер запускается и останавливается автоматически, чтобы вы могли сосредоточиться на сборке.
landing.paso3_titulo=Отслеживайте прогресс
landing.paso3_texto=Каждая сборка мгновенно сохраняется вместе с ее статистикой.
landing.faq_titulo=Часто задаваемые вопросы
landing.faq1_pregunta=Нужен ли аккаунт для использования DTimer?
landing.faq1_respuesta=Нет. Вы можете засекать время без регистрации — ваши результаты сохраняются в вашем браузере. Если вы хотите иметь доступ к ним с разных устройств, вы можете создать бесплатный аккаунт в любое время.
landing.faq2_pregunta=DTimer бесплатный?
landing.faq2_respuesta=Да, DTimer абсолютно бесплатен и не содержит рекламы.
landing.faq3_pregunta=Что такое Ao5, Ao12 и Ao100?
landing.faq3_respuesta=Это средние значения ваших последних 5, 12 или 100 сборок с отбросом лучшего и худшего результатов — стандарт, используемый на официальных соревнованиях.
landing.faq4_pregunta=Можно ли использовать DTimer на мобильном устройстве?
landing.faq4_respuesta=Да, сервис работает прямо в браузере вашего телефона, ничего устанавливать не нужно.
landing.faq5_pregunta=Можно ли импортировать или экспортировать результаты?
landing.faq5_respuesta=Да, вы можете экспортировать свои результаты в файл и импортировать их обратно в любое время через меню настроек таймера.
landing.footer_texto=бесплатный онлайн-таймер для кубика Рубика.

