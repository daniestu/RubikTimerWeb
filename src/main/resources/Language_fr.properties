seo.titulo_inicio=DTimer — Chronomètre Rubik's Cube en ligne gratuit
seo.descripcion_inicio=Chronométrez vos résolutions de Rubik's Cube gratuitement et sans compte. Mélanges officiels style WCA, statistiques Ao5/Ao12/Ao100 et suivi automatique du temps.
seo.titulo_login=Se connecter | DTimer
seo.descripcion_login=Connectez-vous à DTimer pour accéder à vos sessions et statistiques de Rubik's Cube enregistrées.
seo.titulo_registro=Créer un compte gratuit | DTimer
seo.descripcion_registro=Créez votre compte DTimer gratuit pour enregistrer vos temps, sessions et statistiques de Rubik's Cube dans le cloud.
seo.titulo_timer=Chronomètre | DTimer
seo.descripcion_timer=Chronométrez vos résolutions de Rubik's Cube : générez des mélanges, enregistrez vos temps et consultez vos statistiques Ao5, Ao12 et Ao100 en temps réel.
seo.titulo_blog_index=Blog | DTimer
seo.descripcion_blog_index=Guides et conseils Rubik's Cube : statistiques, comment améliorer vos temps et comparatifs de chronomètres en ligne.
seo.titulo_blog_ao5=Que sont l'Ao5, l'Ao12 et l'Ao100 ? | Blog DTimer
seo.descripcion_blog_ao5=Découvrez comment l'Ao5, l'Ao12 et l'Ao100 sont réellement calculés, avec un exemple numérique étape par étape.
seo.titulo_blog_mejorar=Comment améliorer vos temps au Rubik's Cube | Blog DTimer
seo.descripcion_blog_mejorar=Conseils concrets pour réduire vos temps au Rubik's Cube : inspection, lookahead, algorithmes et statistiques.
seo.titulo_blog_cronometros=Les meilleurs chronomètres Rubik's Cube en ligne | Blog DTimer
seo.descripcion_blog_cronometros=Que regarder avant de choisir un chronomètre Rubik's Cube et comparaison des options les plus populaires.

landing.cta_principal=Commencer le chrono
landing.cta_nota=Gratuit. Sans publicité. Sans compte.
landing.cta_final=Commencer à chronométrer gratuitement
landing.h1=Chronomètre Rubik's Cube en ligne gratuit, sans compte
landing.subheadline=Générez des mélanges, chronométrez vos résolutions et consultez vos moyennes Ao5, Ao12 et Ao100 — le tout depuis votre navigateur, sans inscription.
landing.feature1_titulo=Mélanges instantanés
landing.feature1_texto=Générez un nouveau mélange en un clic, conservez l'historique et revenez au précédent quand vous le souhaitez.
landing.feature2_titulo=Statistiques en temps réel
landing.feature2_texto=Ao5, Ao12, Ao100, votre meilleure moyenne mobile et votre écart-type, tous calculés en direct.
landing.feature3_titulo=Aucun compte requis
landing.feature3_texto=Commencez à chronométrer dès maintenant, directement depuis votre navigateur. Pour enregistrer vos temps dans le cloud plus tard, créez un compte gratuit à tout moment.
landing.feature4_titulo=Vos sessions, organisées
landing.feature4_texto=Créez autant de sessions que vous le souhaitez — une par épreuve, une par cube — et basculez de l'une à l'autre instantanément.
landing.pasos_titulo=Comment ça marche
landing.paso1_titulo=Ouvrez le chronomètre
landing.paso1_texto=Sans inscription. Un mélange est généré automatiquement.
landing.paso2_titulo=Résolvez et appuyez sur espace
landing.paso2_texto=Le chrono démarre et s'arrête tout seul pour que vous puissiez vous concentrer sur la résolution.
landing.paso3_titulo=Suivez vos progrès
landing.paso3_texto=Chaque résolution est enregistrée instantanément avec ses statistiques.
landing.faq_titulo=Foire aux questions
landing.faq1_pregunta=Ai-je besoin d'un compte pour utiliser DTimer ?
landing.faq1_respuesta=Non. Vous pouvez chronométrer vos résolutions sans vous inscrire — vos temps sont enregistrés dans votre propre navigateur. Pour y accéder depuis plusieurs appareils, vous pouvez créer un compte gratuit à tout moment.
landing.faq2_pregunta=DTimer est-il gratuit ?
landing.faq2_respuesta=Oui, DTimer est totalement gratuit et sans publicité.
landing.faq3_pregunta=Que signifient Ao5, Ao12 et Ao100 ?
landing.faq3_respuesta=Ce sont les moyennes de vos 5, 12 ou 100 dernières résolutions, en retirant le meilleur et le moins bon temps de chaque groupe — le même standard qu'en compétition officielle.
landing.faq4_pregunta=Puis-je utiliser DTimer sur mobile ?
landing.faq4_respuesta=Oui, il fonctionne directement depuis le navigateur de votre téléphone, sans aucune installation.
landing.faq5_pregunta=Puis-je importer ou exporter mes temps ?
landing.faq5_respuesta=Oui, vous pouvez exporter vos temps dans un fichier et les réimporter à tout moment depuis le menu des options du chronomètre.
landing.footer_texto=chronomètre Rubik's Cube en ligne gratuit.

