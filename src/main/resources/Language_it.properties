seo.titulo_inicio=DTimer — Cronometro per Cubo di Rubik online gratuito
seo.descripcion_inicio=Cronometra le tue risoluzioni del Cubo di Rubik gratuitamente e senza account. Scramble ufficiali stile WCA, statistiche Ao5/Ao12/Ao100 e tracciamento automatico dei tempi.
seo.titulo_login=Accedi | DTimer
seo.descripcion_login=Accedi a DTimer per accedere alle tue sessioni e statistiche del Cubo di Rubik salvate.
seo.titulo_registro=Crea un account gratuito | DTimer
seo.descripcion_registro=Crea il tuo account DTimer gratuito per salvare i tuoi tempi, sessioni e statistiche del Cubo di Rubik nel cloud.
seo.titulo_timer=Cronometro | DTimer
seo.descripcion_timer=Cronometra le tue risoluzioni del Cubo di Rubik: genera scramble, salva i tuoi tempi e controlla le tue statistiche Ao5, Ao12 e Ao100 in tempo reale.
landing.cta_principal=Inizia a cronometrare
landing.cta_nota=Gratis. Senza pubblicità. Senza account.
landing.cta_final=Inizia a cronometrare gratis
landing.h1=Cronometro per Cubo di Rubik online gratuito, senza account
landing.subheadline=Genera scramble, cronometra le tue risoluzioni e controlla le tue medie Ao5, Ao12 e Ao100 — tutto dal tuo browser, senza registrazione.
landing.feature1_titulo=Scramble istantanei
landing.feature1_texto=Genera uno scramble nuovo con un clic, mantieni la cronologia e torna a quello precedente ogni volta che vuoi.
landing.feature2_titulo=Statistiche in tempo reale
landing.feature2_texto=Ao5, Ao12, Ao100, la tua migliore media mobile e la deviazione standard, tutti calcolati dal vivo.
landing.feature3_titulo=Nessun account necessario
landing.feature3_texto=Inizia a cronometrare subito dal tuo browser. Se in seguito desideri salvare i tuoi tempi sul cloud, puoi creare un account gratuito in qualsiasi momento.
landing.feature4_titulo=Le tue sessioni, organizzate
landing.feature4_texto=Crea tutte le sessioni che desideri — una per evento, una per cubo — e passa da una all'altra all'istante.
landing.pasos_titulo=Come funziona
landing.paso1_titulo=Apri il cronometro
landing.paso1_texto=Nessuna registrazione. Uno scramble viene generato automaticamente.
landing.paso2_titulo=Risolvi e premi barra spaziatrice
landing.paso2_texto=Il cronometro parte e si ferma da solo, così puoi concentrarti sulla risoluzione.
landing.paso3_titulo=Controlla i tuoi progressi
landing.paso3_texto=Ogni risoluzione viene salvata all'istante insieme alle sue statistiche.
landing.faq_titulo=Domande frequenti
landing.faq1_pregunta=Ho bisogno di un account per usare DTimer?
landing.faq1_respuesta=No. Puoi cronometrare le tue risoluzioni senza registrarti — i tuoi tempi vengono salvati nel tuo browser. Se preferisci accedervi da più dispositivi, puoi creare un account gratuito in qualsiasi momento.
landing.faq2_pregunta=DTimer è gratuito?
landing.faq2_respuesta=Sì, DTimer è completamente gratuito e senza pubblicità.
landing.faq3_pregunta=Cosa sono Ao5, Ao12 e Ao100?
landing.faq3_respuesta=Sono le medie delle tue ultime 5, 12 o 100 risoluzioni, scartando il tempo migliore e quello peggiore di ogni gruppo — lo stesso standard utilizzato nelle competizioni ufficiali.
landing.faq4_pregunta=Posso usare DTimer su mobile?
landing.faq4_respuesta=Sì, funziona direttamente dal browser del tuo telefono, senza alcuna installazione.
landing.faq5_pregunta=Posso importare o esportare i miei tempi?
landing.faq5_respuesta=Sì, puoi esportare i tuoi tempi in un file e riimportarli in qualsiasi momento dal menu opzioni del cronometro.
landing.footer_texto=cronometro per Cubo di Rubik online gratuito.

