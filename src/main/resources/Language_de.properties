seo.descripcion_registro=Erstelle dein kostenloses DTimer-Konto, um deine Zauberwürfel-Zeiten, Sessions und Statistiken in der Cloud zu speichern.
seo.titulo_timer=Timer | DTimer
seo.descripcion_timer=Stoppe deine Zauberwürfel-Zeiten: Generiere Scrambles, speichere deine Zeiten und prüfe deine Ao5-, Ao12- und Ao100-Statistiken in Echtzeit.
