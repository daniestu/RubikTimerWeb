landing.cta_principal=Zeitmessung starten
landing.cta_nota=Kostenlos. Ohne Werbung. Kein Konto erforderlich.
landing.cta_final=Kostenlos Zeitmessung starten
landing.h1=Kostenloser Online-Rubik's-Cube-Timer, kein Konto erforderlich
landing.subheadline=Generiere Scrambles, stoppe deine Zeiten und prüfe deine Ao5-, Ao12- und Ao100-Durchschnitte — alles direkt im Browser, ohne Registrierung.
landing.feature1_titulo=Sofortige Scrambles
landing.feature1_texto=Generiere mit einem Klick einen neuen Scramble, halte den Verlauf fest und kehre jederzeit zum vorherigen zurück.
landing.feature2_titulo=Echtzeit-Statistiken
landing.feature2_texto=Ao5, Ao12, Ao100, dein bester Schnitt und deine Standardabweichung — alles live berechnet.
landing.feature3_titulo=Kein Konto erforderlich
landing.feature3_texto=Starte die Zeitmessung direkt in deinem Browser. Wenn du deine Zeiten später in der Cloud speichern möchtest, kannst du jederzeit ein kostenloses Konto erstellen.
landing.feature4_titulo=Deine Sessions, organisiert
landing.feature4_texto=Erstelle so viele Sessions wie du möchtest — eine pro Disziplin, eine pro Würfel — und wechsle sofort zwischen ihnen.
landing.pasos_titulo=So funktioniert's
landing.paso1_titulo=Öffne den Timer
landing.paso1_texto=Keine Registrierung nötig. Ein Scramble wird automatisch generiert.
landing.paso2_titulo=Lösen und Leertaste drücken
landing.paso2_texto=Der Timer startet und stoppt von selbst, damit du dich voll auf das Lösen konzentrieren kannst.
landing.paso3_titulo=Fortschritt überprüfen
landing.paso3_texto=Jede Lösung wird sofort zusammen mit ihren Statistiken gespeichert.
landing.faq_titulo=Häufig gestellte Fragen
landing.faq1_pregunta=Benötige ich ein Konto, um DTimer zu nutzen?
landing.faq1_respuesta=Nein. Du kannst deine Zeiten ohne Registrierung stoppen — deine Zeiten werden direkt in deinem Browser gespeichert. Wenn du von mehreren Geräten darauf zugreifen möchtest, kannst du jederzeit ein kostenloses Konto erstellen.
landing.faq2_pregunta=Ist DTimer kostenlos?
landing.faq2_respuesta=Ja, DTimer ist vollständig kostenlos und werbefrei.
landing.faq3_pregunta=Was bedeuten Ao5, Ao12 und Ao100?
landing.faq3_respuesta=Das sind die Durchschnitte deiner letzten 5, 12 oder 100 Solves, wobei der beste und schlechteste Wert gestrichen werden — derselbe Standard wie bei offiziellen Wettkämpfen.
landing.faq4_pregunta=Kann ich DTimer auf dem Smartphone nutzen?
landing.faq4_respuesta=Ja, es funktioniert direkt im Browser deines Smartphones, ganz ohne Installation.
landing.faq5_pregunta=Kann ich meine Zeiten importieren oder exportieren?
landing.faq5_respuesta=Ja, du kannst deine Zeiten in eine Datei exportieren und jederzeit über das Optionsmenü des Timers wieder importieren.
landing.footer_texto=Kostenloser Online-Rubik's-Cube-Timer.

