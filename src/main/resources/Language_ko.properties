title=루빅스 큐브 온라인 타이머

seo.titulo_inicio=DTimer — 무료 온라인 루빅스 큐브 타이머
seo.descripcion_inicio=계정 없이 무료로 루빅스 큐브 기록을 측정하세요. WCA 방식의 공식 스크램블, Ao5/Ao12/Ao100 통계 및 자동 시간 기록 지원.
seo.titulo_login=로그인 | DTimer
seo.descripcion_login=DTimer에 로그인하여 저장된 루빅스 큐브 세션과 통계를 확인하세요.
seo.titulo_registro=무료 계정 만들기 | DTimer
seo.descripcion_registro=무료 DTimer 계정을 생성하고 루빅스 큐브 기록, 세션 및 통계를 클라우드에 저장하세요.
seo.titulo_timer=타이머 | DTimer
seo.descripcion_timer=루빅스 큐브 기록 측정: 스크램블 생성, 기록 저장, Ao5, Ao12, Ao100 통계를 실시간으로 확인하세요.
landing.cta_principal=기록 측정 시작
landing.cta_nota=무료. 광고 없음. 계정 필요 없음.
landing.cta_final=무료로 기록 측정 시작
landing.h1=계정 없이 사용하는 무료 온라인 루빅스 큐브 타이머
landing.subheadline=회원가입 없이 브라우저에서 스크램블 생성, 기록 측정, Ao5, Ao12, Ao100 평균 통계를 확인하세요.
landing.feature1_titulo=실시간 스크램블
landing.feature1_texto=클릭 한 번으로 새 스크램블을 생성하고, 기록을 유지하며, 언제든 이전 스크램블로 되돌아갈 수 있습니다.
landing.feature2_titulo=실시간 통계
landing.feature2_texto=Ao5, Ao12, Ao100, 최고 평균 기록, 표준 편차를 실시간으로 자동 계산합니다.
landing.feature3_titulo=계정 필요 없음
landing.feature3_texto=브라우저에서 바로 기록 측정을 시작하세요. 나중에 클라우드에 기록을 저장하고 싶다면 언제든 무료 계정을 만들 수 있습니다.
landing.feature4_titulo=체계적인 세션 관리
landing.feature4_texto=종목별, 큐브별로 원하는 만큼 세션을 생성하고 즉시 전환하세요.
landing.pasos_titulo=사용 방법
landing.paso1_titulo=타이머 열기
landing.paso1_texto=회원가입 없이 스크램블이 자동으로 생성됩니다.
landing.paso2_titulo=큐브를 맞추고 스페이스바 누르기
landing.paso2_texto=타이머가 자동으로 시작 및 정지되므로 맞추는 데만 집중할 수 있습니다.
landing.paso3_titulo=기록 확인하기
landing.paso3_texto=모든 솔빙 기록은 통계와 함께 즉시 저장됩니다.
landing.faq_titulo=자주 묻는 질문
landing.faq1_pregunta=DTimer를 사용하려면 계정이 필요한가요?
landing.faq1_respuesta=아니요. 가입 없이 기록을 측정할 수 있으며, 기록은 브라우저에 저장됩니다. 여러 기기에서 기록에 접근하고 싶다면 언제든 무료 계정을 생성할 수 있습니다.
landing.faq2_pregunta=DTimer는 무료인가요?
landing.faq2_respuesta=네, DTimer는 광고 없이 완벽한 무료입니다.
landing.faq3_pregunta=Ao5, Ao12, Ao100이란 무엇인가요?
landing.faq3_respuesta=최근 5회, 12회, 100회 솔빙 기록 중 최고 및 최저 기록을 제외한 평균값으로, 공식 대회와 동일한 기준입니다.
landing.faq4_pregunta=모바일에서도 DTimer를 사용할 수 있나요?
landing.faq4_respuesta=네, 별도의 설치 없이 모바일 브라우저에서 바로 사용할 수 있습니다.
landing.faq5_pregunta=기록을 가져오거나 내보낼 수 있나요?
landing.faq5_respuesta=네, 타이머 옵션 메뉴에서 언제든지 기록을 파일로 내보내거나 다시 가져올 수 있습니다.
landing.footer_texto=무료 온라인 루빅스 큐브 타이머.

