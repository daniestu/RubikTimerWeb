seo.titulo_inicio=DTimer — 免费在线魔方计时器
seo.descripcion_inicio=免费记录您的魔方还原时间，无需注册账号。提供 WCA 官方标准打乱、Ao5/Ao12/Ao100 统计数据及自动时间记录。
seo.titulo_login=登录 | DTimer
seo.descripcion_login=登录 DTimer 以查看已保存的魔方分组和统计数据。
seo.titulo_registro=创建免费账号 | DTimer
seo.descripcion_registro=创建免费 DTimer 账号，将您的魔方成绩、分组和统计数据保存至云端。
seo.titulo_timer=计时器 | DTimer
seo.descripcion_timer=记录您的魔方还原时间：生成打乱公式、保存成绩并实时查看 Ao5、Ao12 和 Ao100 统计数据。
seo.titulo_blog_index=博客 | DTimer
seo.descripcion_blog_index=魔方指南与技巧：统计数据、如何提速以及在线计时器对比。
seo.titulo_blog_ao5=什么是 Ao5、Ao12 和 Ao100？ | DTimer 博客
seo.descripcion_blog_ao5=了解 Ao5、Ao12 和 Ao100 的实际计算方式，并提供逐步数字示例。
seo.titulo_blog_mejorar=如何提高魔方还原速度 | DTimer 博客
seo.descripcion_blog_mejorar=降低魔方还原时间的具体技巧：观察（Inspection）、预判（Lookahead）、公式（Algorithms）与数据统计。
seo.titulo_blog_cronometros=最佳在线魔方计时器推荐 | DTimer 博客
seo.descripcion_blog_cronometros=选择魔方计时器时的注意事项，以及最受欢迎的几款计时器对比。

