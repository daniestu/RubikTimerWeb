landing.h1=免费在线魔方计时器，无需注册账号
landing.subheadline=生成打乱公式、记录还原时间并查看 Ao5、Ao12 和 Ao100 平均成绩 — 无需注册，直接在浏览器中打开使用。
landing.feature1_titulo=即时生成打乱
landing.feature1_texto=一键生成新的打乱公式，保留历史记录，随时返回上一个打乱。
landing.feature2_titulo=实时统计数据
landing.feature2_texto=实时计算 Ao5、Ao12、Ao100、最佳滚动平均值以及标准差。
landing.feature3_titulo=无需注册账号
landing.feature3_texto=无需注册，直接在浏览器中开启计时。如果后续需要将成绩同步至云端，可随时创建免费账号。
landing.feature4_titulo=井井有条的分组管理
landing.feature4_texto=按项目或魔方自由创建多个分组，并在它们之间无缝切换。
landing.pasos_titulo=使用说明
landing.paso1_titulo=打开计时器
landing.paso1_texto=无需注册，系统会自动生成打乱公式。
landing.paso2_titulo=还原并按空格键
landing.paso2_texto=计时器会自动启动与停止，让您专注于魔方还原。
landing.paso3_titulo=查看您的进步
landing.paso3_texto=每次还原成绩及统计数据均会自动即时保存。
landing.faq_titulo=常见问题
landing.faq1_pregunta=使用 DTimer 需要注册账号吗？
landing.faq1_respuesta=不需要。您可以无需注册直接进行计时，成绩将保存在本地浏览器中。如果您希望在多台设备间同步数据，可随时创建免费账号。
landing.faq2_pregunta=DTimer 是免费的吗？
landing.faq2_respuesta=是的，DTimer 完全免费且没有任何广告。
landing.faq3_pregunta=什么是 Ao5、Ao12 和 Ao100？
landing.faq3_respuesta=它们是指去掉一个最好成绩和一个最差成绩后，最近 5 次、12 次或 100 次还原的平均成绩，与官方比赛计分规则一致。
landing.faq4_pregunta=可以在手机上使用 DTimer 吗？
landing.faq4_respuesta=可以，直接在手机浏览器中打开即可使用，无需安装任何应用。
landing.faq5_pregunta=我可以导入或导出成绩数据吗？
landing.faq5_respuesta=可以，您随时可以通过计时器的设置菜单将成绩导出为文件，或重新导入数据。
landing.footer_texto=免费在线魔方计时器。

