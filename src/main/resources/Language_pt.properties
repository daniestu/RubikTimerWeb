seo.titulo_inicio=DTimer — Cronômetro de Cubo Mágico online grátis
seo.descripcion_inicio=Cronometre suas resoluções do Cubo Mágico gratuitamente e sem necessidade de conta. Embaralhamentos oficiais no estilo WCA, estatísticas Ao5/Ao12/Ao100 e rastreamento automático de tempos.
seo.titulo_login=Entrar | DTimer
seo.descripcion_login=Faça login no DTimer para acessar suas sessões e estatísticas do Cubo Mágico salvas.
seo.titulo_registro=Criar conta gratuita | DTimer
seo.descripcion_registro=Crie sua conta gratuita no DTimer para salvar seus tempos, sessões e estatísticas do Cubo Mágico na nuvem.
seo.titulo_timer=Cronômetro | DTimer
seo.descripcion_timer=Cronometre suas resoluções do Cubo Mágico: gere embaralhamentos, salve seus tempos e confira suas estatísticas Ao5, Ao12 e Ao100 em tempo real.
seo.titulo_blog_index=Blog | DTimer
seo.descripcion_blog_index=Guias e dicas de Cubo Mágico: estatísticas, como melhorar seus tempos e comparações de cronômetros online.
seo.titulo_blog_ao5=O que são Ao5, Ao12 e Ao100? | Blog DTimer
seo.descripcion_blog_ao5=Aprenda como o Ao5, o Ao12 e o Ao100 são realmente calculados, com um exemplo numérico passo a passo.
seo.titulo_blog_mejorar=Como melhorar seus tempos no Cubo Mágico | Blog DTimer
seo.descripcion_blog_mejorar=Dicas concretas para baixar seus tempos no Cubo Mágico: inspeção, lookahead, algoritmos e estatísticas.
seo.titulo_blog_cronometros=Melhores cronômetros de Cubo Mágico online | Blog DTimer
seo.descripcion_blog_cronometros=O que observar antes de escolher um cronômetro de Cubo Mágico e como as opções mais populares se comparam.

landing.cta_principal=Começar a cronometrar
landing.cta_nota=Grátis. Sem anúncios. Sem necessidade de conta.
landing.cta_final=Comece a cronometrar gratuitamente
landing.h1=Cronômetro de Cubo Mágico online grátis, sem conta
landing.subheadline=Gere embaralhamentos, cronometre suas resoluções e confira suas médias Ao5, Ao12 e Ao100 — tudo pelo navegador, sem necessidade de cadastro.
landing.feature1_titulo=Embaralhamentos instantâneos
landing.feature1_texto=Gere um novo embaralhamento com um clique, mantenha um histórico e volte ao anterior sempre que quiser.
landing.feature2_titulo=Estatísticas em tempo real
landing.feature2_texto=Ao5, Ao12, Ao100, sua melhor média móvel e seu desvio padrão, todos calculados ao vivo.
landing.feature3_titulo=Sem necessidade de conta
landing.feature3_texto=Comece a cronometrar agora mesmo, direto pelo navegador. Se quiser salvar seus tempos na nuvem mais tarde, crie uma conta gratuita a qualquer momento.
landing.feature4_titulo=Suas sessões, organizadas
landing.feature4_texto=Crie quantas sessões desejar — uma por modalidade, uma por cubo — e alterne entre elas instantaneamente.
landing.pasos_titulo=Como funciona
landing.paso1_titulo=Abra o cronômetro
landing.paso1_texto=Sem cadastro. Um embaralhamento é gerado automaticamente.
landing.paso2_titulo=Resolva e aperte espaço
landing.paso2_texto=O cronômetro inicia e para sozinho, para que você foque apenas em resolver.
landing.paso3_titulo=Acompanhe seu progresso
landing.paso3_texto=Cada resolução é salva instantaneamente junto com suas estatísticas.
landing.faq_titulo=Perguntas frequentes
landing.faq1_pregunta=Preciso de uma conta para usar o DTimer?
landing.faq1_respuesta=Não. Você pode cronometrar suas resoluções sem se cadastrar — seus tempos ficam salvos no seu próprio navegador. Se preferir acessá-los de vários dispositivos, você pode criar uma conta gratuita a qualquer momento.
landing.faq2_pregunta=O DTimer é gratuito?
landing.faq2_respuesta=Sim, o DTimer é completamente gratuito e sem anúncios.
landing.faq3_pregunta=O que são Ao5, Ao12 e Ao100?
landing.faq3_respuesta=São as médias das suas últimas 5, 12 ou 100 resoluções, descartando o melhor e o pior tempo de cada grupo — o mesmo padrão usado em competições oficiais.
landing.faq4_pregunta=Posso usar o DTimer no celular?
landing.faq4_respuesta=Sim, funciona diretamente no navegador do seu celular, sem precisar instalar nada.
landing.faq5_pregunta=Posso importar ou exportar meus tempos?
landing.faq5_respuesta=Sim, você pode exportar seus tempos para um arquivo e reimportá-los a qualquer momento pelo menu de opções do cronômetro.
landing.footer_texto=cronômetro de Cubo Mágico online grátis.

