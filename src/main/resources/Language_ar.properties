seo.titulo_inicio=DTimer — مؤقت مكعب روبيك مجاني عبر الإنترنت
seo.descripcion_inicio=احسب وقت حل مكعب روبيك مجانًا وبدون الحاجة لإنشاء حساب. خلطات رسمية بأسلوب WCA، وإحصائيات Ao5/Ao12/Ao100، وتتبع تلقائي للأوقات.
seo.titulo_login=تسجيل الدخول | DTimer
seo.descripcion_login=سجل الدخول إلى DTimer للوصول إلى جلسات وإحصائيات مكعب روبيك المحفوظة.
seo.titulo_registro=إنشاء حساب مجاني | DTimer
seo.descripcion_registro=أنشئ حسابك المجاني في DTimer لحفظ أوقات وجلسات وإحصائيات مكعب روبيك في السحابة.
seo.titulo_timer=المؤقت | DTimer
seo.descripcion_timer=احسب وقت حل مكعب روبيك: قم بإنشاء الخلطات، واحفظ أوقاتك، وتحقق من إحصائيات Ao5 وAo12 وAo100 في الوقت الفعلي.
seo.titulo_blog_index=المدونة | DTimer
seo.descripcion_blog_index=أدلة ونصائح لمكعب روبيك: الإحصائيات، وكيفية تحسين أوقاتك، ومقارنات بين المؤقتات عبر الإنترنت.
seo.titulo_blog_ao5=ما هي Ao5 وAo12 وAo100؟ | مدونة DTimer
seo.descripcion_blog_ao5=تعرف على كيفية حساب Ao5 وAo12 وAo100 بالفعل، مع مثال عددي خطوة بخطوة.
seo.titulo_blog_mejorar=كيفية تحسين أوقاتك في حل مكعب روبيك | مدونة DTimer
seo.descripcion_blog_mejorar=نصائح عملية لتقليل أوقات حل مكعب روبيك: الفحص، النظرة المستقبلية (lookahead)، الخوارزميات والإحصائيات.
seo.titulo_blog_cronometros=أفضل المؤقتات عبر الإنترنت لمكعب روبيك | مدونة DTimer
seo.descripcion_blog_cronometros=ما الذي يجب البحث عنه قبل اختيار مؤقت مكعب روبيك، وكيف تتنافس الخيارات الأكثر شعبية.

landing.cta_principal=ابدأ التوقيت
landing.cta_nota=مجاني. بدون إعلانات. بدون الحاجة لحساب.
landing.cta_final=ابدأ التوقيت مجانًا
landing.h1=مؤقت مكعب روبيك مجاني عبر الإنترنت، بدون الحاجة لحساب
landing.subheadline=قم بإنشاء الخلطات، واحسب وقت حلولك، وتحقق من متوسطات Ao5 وAo12 وAo100 — كل ذلك من متصفحك دون الحاجة للتسجيل.
landing.feature1_titulo=خلطات فورية
landing.feature1_texto=أنشئ خلطة جديدة بنقرة واحدة، واحتفظ بالسجل، وارجع إلى الخلطة السابقة متى أردت.
landing.feature2_titulo=إحصائيات في الوقت الفعلي
landing.feature2_texto=يتم حساب Ao5 وAo12 وAo100 وأفضل متوسط متحرك وانحرافك المعياري بشكل مباشر.
landing.feature3_titulo=لا حاجة لإنشاء حساب
landing.feature3_texto=ابدأ التوقيت الآن مباشرة من متصفحك. إذا أردت حفظ أوقاتك في السحابة لاحقًا، يمكنك إنشاء حساب مجاني في أي وقت.
landing.feature4_titulo=جلساتك، منظمة
landing.feature4_texto=أنشئ عدد الجلسات الذي تريده — واحدة لكل فئة أو لكل مكعب — وقم بالتنقل بينها فورًا.
landing.pasos_titulo=كيف يعمل
landing.paso1_titulo=افتح المؤقت
landing.paso1_texto=بدون تسجيل. يتم إنشاء الخلطة تلقائيًا.
landing.paso2_titulo=حل واضغط على زر المسافة
landing.paso2_texto=يبدأ المؤقت ويتوقف تلقائيًا لتركز على الحل.
landing.paso3_titulo=تحقق من تقدمك
landing.paso3_texto=يتم حفظ كل حل فورًا مع إحصائياته.
landing.faq_titulo=الأسئلة الشائعة
landing.faq1_pregunta=هل أحتاج إلى حساب لاستخدام DTimer؟
landing.faq1_respuesta=لا. يمكنك توقيت حلولك دون تسجيل — يتم حفظ أوقاتك في متصفحك الخاص. إذا كنت تفضل الوصول إليها من أجهزة متعددة، يمكنك إنشاء حساب مجاني في أي وقت.
landing.faq2_pregunta=هل DTimer مجاني؟
landing.faq2_respuesta=نعم، DTimer مجاني تمامًا وبدون إعلانات.
landing.faq3_pregunta=ما هي Ao5 وAo12 وAo100؟
landing.faq3_respuesta=هي متوسطات أخر 5 أو 12 أو 100 حل، مع استبعاد أفضل وأسوأ وقت من كل مجموعة — نفس المعيار المستخدم في المسابقات الرسمية.
landing.faq4_pregunta=هل يمكنني استخدام DTimer على الهاتف المحمول؟
landing.faq4_respuesta=نعم، يعمل مباشرة من متصفح هاتفك المحمول دون الحاجة للتثبيت.
landing.faq5_pregunta=هل يمكنني استيراد أو تصدير أوقاتي؟
landing.faq5_respuesta=نعم، يمكنك تصدير أوقاتك إلى ملف وإعادة استيرادها في أي وقت من قائمة خيارات المؤقت.
landing.footer_texto=مؤقت مكعب روبيك مجاني عبر الإنترنت.

