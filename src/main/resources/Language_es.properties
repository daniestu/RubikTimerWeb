seo.titulo_inicio=DTimer — Cronómetro online gratis para cubo de Rubik
seo.descripcion_inicio=Cronometra tus resoluciones del cubo de Rubik gratis y sin necesidad de cuenta. Scrambles al estilo WCA, estadísticas Ao5/Ao12/Ao100 y guardado automático de tus tiempos.
seo.titulo_login=Iniciar sesión | DTimer
seo.descripcion_login=Inicia sesión en DTimer para acceder a tus sesiones y estadísticas de cubo de Rubik guardadas.
seo.titulo_registro=Crear cuenta gratis | DTimer
seo.descripcion_registro=Crea tu cuenta gratuita en DTimer y guarda tus tiempos, sesiones y estadísticas de cubo de Rubik en la nube.
seo.titulo_timer=Cronómetro | DTimer
seo.descripcion_timer=Cronometra tus resoluciones de cubo de Rubik: genera scrambles, guarda tus tiempos y consulta tus estadísticas Ao5, Ao12 y Ao100 en tiempo real.
seo.titulo_blog_index=Blog | DTimer
seo.descripcion_blog_index=Guías y consejos sobre cubo de Rubik: estadísticas, cómo mejorar tus tiempos y comparativas de cronómetros online.
seo.titulo_blog_ao5=Qué es el Ao5, el Ao12 y el Ao100 | Blog DTimer
seo.descripcion_blog_ao5=Aprende cómo se calculan de verdad el Ao5, el Ao12 y el Ao100, con un ejemplo numérico paso a paso.
seo.titulo_blog_mejorar=Cómo mejorar tus tiempos de cubo de Rubik | Blog DTimer
seo.descripcion_blog_mejorar=Consejos concretos para bajar tiempos resolviendo el cubo de Rubik: inspección, lookahead, algoritmos y estadísticas.
seo.titulo_blog_cronometros=Mejores cronómetros online para cubo de Rubik | Blog DTimer
seo.descripcion_blog_cronometros=Qué mirar antes de elegir un cronómetro de cubo de Rubik, y cómo se comparan las opciones más usadas por la comunidad.

landing.cta_principal=Empezar a cronometrar
landing.cta_nota=Gratis. Sin anuncios. Sin necesidad de cuenta.
landing.cta_final=Empieza a cronometrar gratis
landing.h1=Cronómetro online para cubo de Rubik, gratis y sin cuenta
landing.subheadline=Genera scrambles, cronometra tus resoluciones y consulta tus medias Ao5, Ao12 y Ao100 — todo desde el navegador, sin registrarte.
landing.feature1_titulo=Scrambles al instante
landing.feature1_texto=Genera mezclas nuevas con un clic, guarda el historial y repite la anterior cuando quieras.
landing.feature2_titulo=Estadísticas al momento
landing.feature2_texto=Ao5, Ao12, Ao100, tu mejor media histórica y la desviación de tus tiempos, calculadas en tiempo real.
landing.feature3_titulo=Sin necesidad de cuenta
landing.feature3_texto=Empieza a cronometrar ahora mismo desde el navegador. Si más adelante quieres guardar tus tiempos en la nube, puedes crear una cuenta gratuita cuando quieras.
landing.feature4_titulo=Tus sesiones, organizadas
landing.feature4_texto=Crea tantas sesiones como quieras — una por modalidad, una por cubo — y cambia entre ellas al instante.
landing.pasos_titulo=Cómo funciona
landing.paso1_titulo=Entra en el cronómetro
landing.paso1_texto=Sin registro. Se genera un scramble automáticamente.
landing.paso2_titulo=Resuelve y pulsa espacio
landing.paso2_texto=El cronómetro arranca y para solo, para que te concentres en resolver.
landing.paso3_titulo=Consulta tu progreso
landing.paso3_texto=Cada tiempo se guarda al momento junto a sus estadísticas.
landing.faq_titulo=Preguntas frecuentes
landing.faq1_pregunta=¿Necesito crear una cuenta para usar DTimer?
landing.faq1_respuesta=No. Puedes cronometrar tus resoluciones sin registrarte, tus tiempos se guardan en tu propio navegador. Si prefieres acceder a ellos desde varios dispositivos, puedes crear una cuenta gratuita en cualquier momento.
landing.faq2_pregunta=¿DTimer es gratis?
landing.faq2_respuesta=Sí, DTimer es completamente gratuito y sin anuncios.
landing.faq3_pregunta=¿Qué es el Ao5, el Ao12 y el Ao100?
landing.faq3_respuesta=Son las medias de tus últimos 5, 12 o 100 tiempos, descartando el mejor y el peor de cada grupo — el mismo criterio que se usa en las competiciones oficiales.
landing.faq4_pregunta=¿Puedo usar DTimer en el móvil?
landing.faq4_respuesta=Sí, funciona directamente desde el navegador de tu móvil, sin necesidad de instalar nada.
landing.faq5_pregunta=¿Puedo importar o exportar mis tiempos?
landing.faq5_respuesta=Sí, puedes exportar tus tiempos a un fichero y volver a importarlos cuando quieras desde el menú de opciones del cronómetro.
landing.footer_texto=cronómetro online para cubo de Rubik.

