services:
  # --- BASE DE DATOS (MySQL) ---
  bd:
    image: mysql:8.0
    container_name: mysql_rubikTimer
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - datos_mysql:/var/lib/mysql
    networks:
      - red_interna
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- SERVIDOR WEB (Tomcat) ---
  web:
    build: .
    container_name: tomcat_rubikTimer
    restart: always
    env_file:
      - .env
    depends_on:
      - bd
    networks:
      - red_interna
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  datos_mysql:

networks:
  red_interna:
    driver: bridge